<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Forecast Works</title>
<style>
  :root {
    --board: #dcd7c9;
    --ink: #23262e;
    --dim: #8b8578;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--board); }
  body { background: var(--board); min-height: 100%;
    font: 13px/1.5 "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow",
          system-ui, sans-serif; }

  /* The document scrolls. Nothing zooms: every section is drawn at one fixed width so the
     lettering keeps the size it was drawn at. */
  #doc { margin: 0 auto; background: #f4f1e8; box-shadow: 0 0 44px rgba(40,34,24,.30);
    padding-bottom: 40px; }
  #doc section { position: relative; display: block; }
  #doc canvas { display: block; width: 100%; height: auto;
    /* Ink multiplies into the paper, so it darkens the tooth rather than sitting on top. */
    mix-blend-mode: multiply; }

  /* The only chrome: a masthead rail that follows the reader, and the chip that names what is
     under the cursor. Everything else is drawn on the paper, in ink, in millimetres. */
  /* The rail carries the masthead and the table of contents, and it stays put while the
     document runs under it, so the reader always knows where in the sheet they are. */
  #rail { position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    background: rgba(220,215,201,.965); border-bottom: 1px solid rgba(107,97,82,.28);
    display: flex; align-items: center; gap: 14px; padding: 5px 16px 4px;
    backdrop-filter: blur(2px); }
  #mast, #hint { color: #6b6152; font-size: 9.5px; letter-spacing: .22em;
    text-transform: uppercase; white-space: nowrap; }
  #hint { color: #948b7c; letter-spacing: .13em; margin-left: auto; }
  #nav { display: flex; gap: 2px; flex-wrap: wrap; }
  #nav button { appearance: none; border: 0; background: transparent; cursor: pointer;
    color: #948b7c; font: inherit; font-size: 8.5px; letter-spacing: .15em;
    text-transform: uppercase; white-space: nowrap; padding: 3px 6px 2px;
    border-bottom: 2px solid transparent; }
  #nav button:hover { color: #6b6152; }
  #nav button.on { color: #1554a6; font-weight: 700; border-bottom-color: #1554a6; }
  #doc { margin-top: 30px; }
  @media (max-width: 1100px) { #hint { display: none; } }
  #chip { position: fixed; pointer-events: none; display: none; z-index: 40;
    background: rgba(20,17,13,.93); color: #e8e2d4; padding: 5px 9px;
    font-size: 10.5px; letter-spacing: .05em; white-space: nowrap; max-width: 340px; }
  #chip b { display: block; font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
    color: #c8a24a; font-weight: 700; margin-bottom: 2px; }
  @media (max-width: 900px) { #nav { display: none; } }
</style>
</head>
<body>
<div id="rail"><span id="mast">reading the forecast…</span>
  <nav id="nav"></nav>
  <span id="hint">scroll to read · click a mark for its note</span></div>
<div id="doc"></div>
<div id="chip"></div>
<script>window.__BUILD = "20260812-0007";</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
